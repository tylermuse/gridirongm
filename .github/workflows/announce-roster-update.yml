name: Announce roster update

# When a weekly roster refresh merges to main (it adds a roster-updates/*.md note),
# wait for bs-football.com to go live, post the note to Discord, and comment on the PR
# with a one-click, pre-filled Reddit post.
#
# Setup (one time):
#   Settings → Secrets and variables → Actions
#     Secret   DISCORD_ROSTER_WEBHOOK_URL  — Discord channel → Edit Channel → Integrations → Webhooks → New Webhook → Copy URL
#     Variable REDDIT_SUBREDDIT (optional) — defaults to Gridiron_GM_Game

on:
  push:
    branches: [main]
    paths: ['roster-updates/*.md']
  workflow_dispatch:
    inputs:
      file:
        description: 'Note to announce, e.g. roster-updates/2026-11-17.md'
        required: true
      skip_discord:
        description: 'Skip Discord (only rebuild the Reddit link)'
        type: boolean
        default: false

concurrency:
  group: announce-roster-update
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            roster-updates
            scripts/announce-roster-update.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find new notes
        id: notes
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_FILE: ${{ inputs.file }}
        run: |
          if [ -n "$INPUT_FILE" ]; then
            files="$INPUT_FILE"
          else
            base="$BEFORE"
            git cat-file -e "$base" 2>/dev/null || base="HEAD~1"
            # Only newly added notes — edits to old notes shouldn't re-announce.
            files=$(git diff --name-only --diff-filter=A "$base" HEAD -- 'roster-updates/*.md')
          fi
          echo "Notes: ${files:-none}"
          { echo 'files<<EOF'; echo "$files"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Announce
        if: steps.notes.outputs.files != ''
        env:
          DISCORD_ROSTER_WEBHOOK_URL: ${{ inputs.skip_discord != true && secrets.DISCORD_ROSTER_WEBHOOK_URL || '' }}
          REDDIT_SUBREDDIT: ${{ vars.REDDIT_SUBREDDIT }}
          FILES: ${{ steps.notes.outputs.files }}
        run: |
          : > comment.md
          for f in $FILES; do
            SUMMARY_FILE=one.md node scripts/announce-roster-update.mjs "$f"
            cat one.md >> comment.md; echo >> comment.md
          done
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the merged PR
        if: steps.notes.outputs.files != '' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh api "repos/${{ github.repository }}/issues/$pr/comments" -F body=@comment.md >/dev/null
            echo "Commented on #$pr"
          else
            echo "No PR found for ${{ github.sha }}; see the job summary for the Reddit link."
          fi
